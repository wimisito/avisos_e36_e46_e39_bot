name: Wallapop BMW

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallapop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar Wallapop
        run: python wallapop_bmw_alertas.py
        env:
          RUN_ONCE: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar anuncios ya vistos
        run: |
          git config user.name "wallapop-bot"
          git config user.email "wallapop-bot@users.noreply.github.com"
          git add seen.json
          git commit -m "actualizar anuncios vistos" || exit 0
          git push
